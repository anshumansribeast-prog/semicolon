name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  image:
    name: Build image and smoke-test it
    runs-on: ubuntu-latest
    steps:
      - name: Check out the code
        uses: actions/checkout@v5

      - name: Static site checks
        run: python tools/check-site.py

      - name: Test fallback gate without secrets
        run: python tests/test_openai_fallback.py

      - name: Build the image
        run: docker build -t semicolon:ci .

      - name: Start the container
        run: |
          docker run -d --name semicolon -p 8080:80 semicolon:ci
          for i in $(seq 1 15); do
            if curl -fsS http://localhost:8080/ > /dev/null; then break; fi
            if [ "$i" = "15" ]; then docker logs semicolon; exit 1; fi
            sleep 1
          done

      - name: Smoke test — does it really serve the site?
        run: |
          pages="/ /index.html /pages/about.html /pages/blog.html /pages/contact.html /pages/learn.html /pages/lesson.html /pages/playground.html /pages/post.html /pages/ada.html /pages/concepts.html /pages/projects.html /css/style.css /js/main.js /js/ada-chat.js /js/ada-api.js /js/webbuilder.js /img/og.jpg /api/ada"
          for page in $pages; do
            code=$(curl -s -o /dev/null -w "%{http_code}" "http://localhost:8080${page}")
            [ "$code" = "200" ] || { docker logs semicolon; exit 1; }
          done
          code=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8080/does-not-exist)
          [ "$code" = "404" ] || { docker logs semicolon; exit 1; }

      - name: Container logs
        if: always()
        run: docker logs semicolon || true

      - name: Stop the container
        if: always()
        run: docker rm -f semicolon || true

  publish:
    name: Publish to GitHub Container Registry
    runs-on: ubuntu-latest
    needs: image
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Check out the code
        uses: actions/checkout@v5
      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push
        run: |
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          IMAGE="ghcr.io/${OWNER}/semicolon"
          docker build -t "${IMAGE}:latest" -t "${IMAGE}:${{ github.sha }}" .
          docker push "${IMAGE}:latest"
          docker push "${IMAGE}:${{ github.sha }}"
