# Semicolon on the main server: site on port 80 + Ada.
#
# Existing primary AI configuration remains unchanged. Optional fallback
# variables are server-side only and are empty unless explicitly configured.

services:
  web:
    build: .
    image: ghcr.io/anshumansribeast-prog/semicolon:latest
    ports:
      - "80:80"
    environment:
      ADA_HOST: "127.0.0.1"
      ADA_PORT: "8420"
      AI_API_KEY: "${AI_API_KEY:?Set AI_API_KEY in the deployment environment}"
      AI_API_URL: "${AI_API_URL:-https://api.groq.com/openai/v1}"
      AI_MODEL: "${AI_MODEL:-openai/gpt-oss-120b}"
      ADA_VISITOR_NAME: "AnshX"
      SEMICOLON_ADMIN_TOKEN: "${SEMICOLON_ADMIN_TOKEN:-}"
      ADA_FALLBACK_API_URL: "${ADA_FALLBACK_API_URL:-}"
      ADA_FALLBACK_API_KEY: "${ADA_FALLBACK_API_KEY:-}"
      ADA_FALLBACK_MODEL: "${ADA_FALLBACK_MODEL:-}"
    restart: unless-stopped
