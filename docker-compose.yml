# Semicolon on the main server: site on port 80 + Ada (Groq API).
#
#   AI_API_KEY=your_groq_key docker compose up -d --build
#
# Get a free key at https://console.groq.com
# Then open http://SERVER/pages/ada.html

services:
  web:
    build: .
    image: ghcr.io/anshumansribeast-prog/semicolon:latest
    ports:
      - "80:80"
    environment:
      ADA_HOST: "127.0.0.1"
      ADA_PORT: "8420"
      # Groq (free tier) by default; any OpenAI-compatible endpoint works.
      AI_API_KEY: "${AI_API_KEY:?Set AI_API_KEY in the deployment environment}"
      AI_API_URL: "${AI_API_URL:-https://api.groq.com/openai/v1}"
      AI_MODEL: "${AI_MODEL:-llama-3.3-70b-versatile}"
      ADA_VISITOR_NAME: "AnshX"
      # Shared secret between this server and Cosmos's dashboard, which
      # is allowed to read the summary at /api/stats/summary.
      SEMICOLON_ADMIN_TOKEN: "${SEMICOLON_ADMIN_TOKEN:-}"
    restart: unless-stopped
